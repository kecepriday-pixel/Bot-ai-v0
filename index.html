<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TYUSS AI — Julius</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#020813;
  --panel:#071421;
  --cyan:#55eaff;
  --blue:#368cff;
  --text:#eafcff;
  --muted:#7893a4;
}

body{
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 50% 0%,#07385a 0%,transparent 35%),
    var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
}

.app{
  max-width:900px;
  height:100vh;
  margin:auto;
  display:flex;
  flex-direction:column;
  border-left:1px solid #102d40;
  border-right:1px solid #102d40;
  background:rgba(2,8,19,.88);
}

/* HEADER */

header{
  height:70px;
  display:flex;
  align-items:center;
  padding:0 18px;
  border-bottom:1px solid #123044;
  background:rgba(5,17,29,.92);
  backdrop-filter:blur(15px);
}

.avatar{
  width:43px;
  height:38px;
  margin-right:12px;
  border-radius:55% 55% 45% 45%;
  background:linear-gradient(145deg,#8cffff,#38bfff,#176be8);
  box-shadow:0 0 18px #3edcff88;
  position:relative;
}

.avatar:before,
.avatar:after{
  content:"";
  position:absolute;
  width:4px;
  height:6px;
  background:#06121c;
  top:17px;
  border-radius:50%;
}

.avatar:before{left:13px}
.avatar:after{right:13px}

.name{
  font-weight:800;
}

.status{
  font-size:12px;
  color:#65ffb0;
  margin-top:4px;
}

.header-buttons{
  margin-left:auto;
  display:flex;
  gap:8px;
}

.icon-btn{
  border:1px solid #16425c;
  background:#091c2c;
  color:#9fdff0;
  padding:8px 11px;
  border-radius:9px;
  cursor:pointer;
}

/* CHAT */

#chat{
  flex:1;
  overflow-y:auto;
  padding:22px 16px 130px;
}

.welcome{
  text-align:center;
  padding:35px 10px;
}

.big-slime{
  width:90px;
  height:72px;
  margin:0 auto 20px;
  border-radius:55% 55% 45% 45%;
  background:linear-gradient(145deg,#91ffff,#3cc7ff,#176ae7);
  box-shadow:
    0 0 25px #55eaff88,
    0 0 70px #237dff44;
}

.welcome h1{
  font-size:27px;
  margin-bottom:9px;
}

.welcome h1 span{
  color:var(--cyan);
}

.welcome p{
  color:var(--muted);
  font-size:14px;
  line-height:1.6;
}

.message{
  display:flex;
  margin:14px 0;
}

.message.user{
  justify-content:flex-end;
}

.bubble{
  max-width:78%;
  padding:13px 15px;
  line-height:1.55;
  font-size:14px;
  white-space:pre-wrap;
  word-break:break-word;
}

.user .bubble{
  background:linear-gradient(135deg,#168cc8,#1768d5);
  border-radius:17px 17px 4px 17px;
}

.bot .bubble{
  background:#081a29;
  border:1px solid #11354b;
  border-radius:17px 17px 17px 4px;
}

.bot-name{
  color:var(--cyan);
  font-size:11px;
  margin-bottom:5px;
  font-weight:bold;
}

.typing{
  color:#6f91a5;
}

/* INPUT */

.input-area{
  position:absolute;
  bottom:0;
  width:min(898px,100%);
  padding:12px 14px 18px;
  background:linear-gradient(transparent,#020813 25%);
}

.input-box{
  display:flex;
  align-items:flex-end;
  background:#081a29;
  border:1px solid #16415a;
  border-radius:18px;
  padding:8px;
  box-shadow:0 10px 40px #0008;
}

textarea{
  flex:1;
  resize:none;
  max-height:130px;
  height:44px;
  padding:12px;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-family:inherit;
  font-size:14px;
}

.send{
  width:44px;
  height:44px;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,var(--cyan),var(--blue));
  color:#00131c;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
}

.footer{
  text-align:center;
  font-size:10px;
  color:#48687a;
  margin-top:7px;
}

/* MODAL */

.modal-bg{
  display:none;
  position:fixed;
  inset:0;
  background:#000b;
  z-index:10;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal{
  width:min(440px,100%);
  background:#071522;
  border:1px solid #16435d;
  border-radius:18px;
  padding:22px;
}

.modal h2{
  color:var(--cyan);
  margin-bottom:8px;
}

.modal p{
  color:#829eae;
  font-size:13px;
  line-height:1.5;
  margin-bottom:15px;
}

.modal input{
  width:100%;
  background:#03101a;
  color:white;
  border:1px solid #17415a;
  border-radius:10px;
  padding:13px;
  outline:none;
  margin-bottom:12px;
}

.modal-actions{
  display:flex;
  gap:8px;
}

.modal button{
  flex:1;
  padding:11px;
  border:0;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.save{
  background:linear-gradient(135deg,var(--cyan),var(--blue));
}

.cancel{
  background:#102737;
  color:white;
}

@media(max-width:600px){
  .app{
    border:0;
  }

  .bubble{
    max-width:88%;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="avatar"></div>

  <div>
    <div class="name">TYUSS AI</div>
    <div class="status">● Gemini System</div>
  </div>

  <div class="header-buttons">
    <button class="icon-btn" onclick="openSettings()">⚙</button>
    <button class="icon-btn" onclick="clearChat()">⌫</button>
  </div>
</header>

<div id="chat">

  <div class="welcome" id="welcome">
    <div class="big-slime"></div>

    <h1>TYUSS <span>AI</span></h1>

    <p>
      WhatsApp Bot Project by Julius<br>
      Powered by Gemini
    </p>
  </div>

</div>

<div class="input-area">

  <div class="input-box">
    <textarea
      id="input"
      placeholder="Tanya TYUSS..."
      oninput="resizeInput(this)"
    ></textarea>

    <button class="send" onclick="sendMessage()">➤</button>
  </div>

  <div class="footer">
    TYUSS_V0 • Developed by Julius
  </div>

</div>

</div>

<!-- SETTINGS -->

<div class="modal-bg" id="modal">

  <div class="modal">

    <h2>TYUSS Configuration</h2>

    <p>
      Masukkan Gemini API Key milikmu.
      Key disimpan di browser ini dan tidak ditulis ke source website.
    </p>

    <input
      type="password"
      id="apiKey"
      placeholder="Gemini API Key"
    >

    <div class="modal-actions">
      <button class="cancel" onclick="closeSettings()">
        Batal
      </button>

      <button class="save" onclick="saveKey()">
        Simpan
      </button>
    </div>

  </div>

</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("input");

let history = [];

const SYSTEM_PROMPT = \`
Nama kamu TYUSS AI.

Kamu adalah asisten AI dari project TYUSS_V0
yang dibuat oleh Julius.

Gaya bicaramu santai, ramah, dan jelas.
Gunakan Bahasa Indonesia kecuali pengguna
meminta bahasa lain.

Jangan mengaku sebagai manusia.
Jika ditanya siapa developermu, jawab Julius.
\`;

function resizeInput(el){
  el.style.height = "44px";
  el.style.height =
    Math.min(el.scrollHeight,130) + "px";
}

input.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

function addMessage(text,type){

  const welcome =
    document.getElementById("welcome");

  if(welcome) welcome.remove();

  const wrap =
    document.createElement("div");

  wrap.className =
    "message " + type;

  const bubble =
    document.createElement("div");

  bubble.className="bubble";

  if(type==="bot"){

    const name =
      document.createElement("div");

    name.className="bot-name";
    name.textContent="TYUSS AI";

    bubble.appendChild(name);
  }

  const content =
    document.createElement("div");

  content.textContent=text;

  bubble.appendChild(content);
  wrap.appendChild(bubble);
  chat.appendChild(wrap);

  chat.scrollTop =
    chat.scrollHeight;

  return wrap;
}

async function sendMessage(){

  const text =
    input.value.trim();

  if(!text) return;

  const key =
    localStorage.getItem("tyussGeminiKey");

  if(!key){
    openSettings();
    return;
  }

  input.value="";
  resizeInput(input);

  addMessage(text,"user");

  history.push({
    role:"user",
    parts:[{text}]
  });

  const typing =
    addMessage("Sedang berpikir...","bot");

  try{

    const contents = [
      {
        role:"user",
        parts:[{
          text:SYSTEM_PROMPT
        }]
      },
      {
        role:"model",
        parts:[{
          text:"Siap. Saya adalah TYUSS AI."
        }]
      },
      ...history
    ];

    const response = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json",
          "x-goog-api-key":key
        },

        body:JSON.stringify({
          contents,
          generationConfig:{
            temperature:0.8,
            maxOutputTokens:1200
          }
        })
      }
    );

    const data =
      await response.json();

    typing.remove();

    if(!response.ok){
      throw new Error(
        data?.error?.message ||
        "Gemini API error"
      );
    }

    const answer =
      data?.candidates?.[0]
      ?.content?.parts
      ?.map(p=>p.text || "")
      .join("") ||
      "TYUSS tidak mendapatkan jawaban.";

    addMessage(answer,"bot");

    history.push({
      role:"model",
      parts:[{text:answer}]
    });

  }catch(err){

    typing.remove();

    addMessage(
      "⚠️ Gagal menghubungi Gemini.\\n\\n" +
      err.message,
      "bot"
    );

  }

}

function openSettings(){

  document.getElementById("modal")
    .style.display="flex";

  const saved =
    localStorage.getItem(
      "tyussGeminiKey"
    );

  if(saved){
    document.getElementById("apiKey")
      .value=saved;
  }
}

function closeSettings(){

  document.getElementById("modal")
    .style.display="none";
}

function saveKey(){

  const key =
    document.getElementById("apiKey")
    .value.trim();

  if(!key){
    alert("Masukkan API Key dulu.");
    return;
  }

  localStorage.setItem(
    "tyussGeminiKey",
    key
  );

  closeSettings();

  alert("API Key tersimpan di browser.");
}

function clearChat(){

  history=[];

  chat.innerHTML=\`
    <div class="welcome" id="welcome">
      <div class="big-slime"></div>

      <h1>
        TYUSS <span>AI</span>
      </h1>

      <p>
        WhatsApp Bot Project by Julius<br>
        Powered by Gemini
      </p>
    </div>
  \`;
}

</script>

</body>
</html>
